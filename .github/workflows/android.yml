name: Build Android APK

on:
  push:
    branches: [main]
    paths-ignore: ["content/**", "**.md"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      APP_VERSION_CODE: ${{ github.run_number }}
      APP_VERSION: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Build web app and sync into Android
        run: |
          npm run build
          npx cap sync android

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Signing with the release key."
          else
            echo "::warning::No KEYSTORE_BASE64 secret. The APK will be signed with a temporary debug key."
          fi

      - name: Build release APK
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Name the APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/ParamparaVault-v${APP_VERSION}.apk"
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: ParamparaVault-v${{ env.APP_VERSION }}
          path: dist/*.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: Parampara Vault v${{ env.APP_VERSION }}
          make_latest: true
          files: dist/*.apk
          body: |
            📿 **Parampara Vault v${{ env.APP_VERSION }}**

            **Install on Android:** download `ParamparaVault-v${{ env.APP_VERSION }}.apk` below, open it, and allow "Install unknown apps" for your browser or WhatsApp when asked.
            Already installed? This version installs over the old one and keeps your progress.
